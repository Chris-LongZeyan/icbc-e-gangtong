<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="总资产充足，仍须检查付款币种和用途"><title>总资产充足，仍须检查付款币种和用途</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#999"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="32" y="38" text-anchor="start" font-size="23" fill="#262626">总资产充足，仍须检查付款币种和用途</text><rect x="32" y="78" width="278" height="100" rx="8" fill="#fafafa" stroke="#e4e4e4" /><text x="171.0" y="108" text-anchor="middle" font-size="19" fill="#262626">资产分属两种币种</text><text x="171.0" y="135" text-anchor="middle" font-size="14" fill="#666666">CNY 10,000</text><text x="171.0" y="158" text-anchor="middle" font-size="14" fill="#666666">HKD 20,000</text><rect x="360" y="78" width="278" height="100" rx="8" fill="#fff4f4" stroke="#b51c26" /><text x="499.0" y="108" text-anchor="middle" font-size="19" fill="#b51c26">拟支付 CNY 12,000</text><text x="499.0" y="135" text-anchor="middle" font-size="14" fill="#666666">目标币种缺口：2,000</text><text x="499.0" y="158" text-anchor="middle" font-size="14" fill="#666666">参考价：1.176990 HKD/CNH</text><path d="M310 128 L355 128" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="32" y="247" width="436" height="112" rx="8" fill="#fff4f4" stroke="#b51c26" /><text x="250.0" y="277" text-anchor="middle" font-size="19" fill="#b51c26">没有额外受保护港币用途</text><text x="250.0" y="304" text-anchor="middle" font-size="14" fill="#666666">最少扣 HKD 2,353.98 → CNY 2,000</text><text x="250.0" y="327" text-anchor="middle" font-size="14" fill="#666666">少扣 HKD 0.01 → CNY 1,999.99</text><rect x="532" y="247" width="436" height="112" rx="8" fill="#fafafa" stroke="#e4e4e4" /><text x="750.0" y="277" text-anchor="middle" font-size="19" fill="#262626">另有 HKD 19,000 租金用途</text><text x="750.0" y="304" text-anchor="middle" font-size="14" fill="#666666">可换上限仅 HKD 1,000</text><text x="750.0" y="327" text-anchor="middle" font-size="14" fill="#666666">方案不可行：不能挪用租金</text><path d="M460 180 L255 244" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M540 180 L745 244" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><text x="32" y="398" text-anchor="start" font-size="14" fill="#666666">合成算例；固定参考快照，额外费用为0，到账须满足付款日；不是成交承诺。</text></g></svg>