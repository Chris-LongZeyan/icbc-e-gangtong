<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="先分清转入钱包与商户消费"><title>先分清转入钱包与商户消费</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#999"/></marker></defs><rect width="1000" height="350" fill="white"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="32" y="38" text-anchor="start" font-size="23" fill="#262626">先分清转入钱包与商户消费</text><rect x="32" y="85" width="275" height="104" rx="8" fill="#fafafa" stroke="#e4e4e4" /><text x="169.5" y="115" text-anchor="middle" font-size="19" fill="#262626">银行账户 → 钱包</text><text x="169.5" y="142" text-anchor="middle" font-size="14" fill="#666666">充值 HKD 500</text><text x="169.5" y="165" text-anchor="middle" font-size="14" fill="#666666">资金位置变化</text><rect x="362" y="85" width="275" height="104" rx="8" fill="#fff4f4" stroke="#b51c26" /><text x="499.5" y="115" text-anchor="middle" font-size="19" fill="#b51c26">钱包 → 商户</text><text x="499.5" y="142" text-anchor="middle" font-size="14" fill="#666666">已知消费 HKD 148</text><text x="499.5" y="165" text-anchor="middle" font-size="14" fill="#666666">真实消费发生</text><path d="M307 138 L355 138" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="692" y="85" width="276" height="104" rx="8" fill="#fafafa" stroke="#e4e4e4" /><text x="830.0" y="115" text-anchor="middle" font-size="19" fill="#262626">区间与余额核对</text><text x="830.0" y="142" text-anchor="middle" font-size="14" fill="#666666">缺失期间单独标记</text><text x="830.0" y="165" text-anchor="middle" font-size="14" fill="#666666">不能虚构期末余额</text><path d="M637 138 L687 138" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="150" y="238" width="700" height="82" rx="8" fill="#fff4f4" stroke="#b51c26" /><text x="500.0" y="268" text-anchor="middle" font-size="19" fill="#b51c26">不要得出“消费 HKD 648”</text><text x="500.0" y="295" text-anchor="middle" font-size="14" fill="#666666">主账本钱包汇总与独立明细分开；完整覆盖前不自动叠加</text></g></svg>