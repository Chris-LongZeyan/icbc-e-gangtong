<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-label="先验证任务价值，再评估银行经营收益"><title>先验证任务价值，再评估银行经营收益</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#999"/></marker></defs><rect width="1000" height="390" fill="white"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="32" y="38" text-anchor="start" font-size="23" fill="#262626">先验证任务价值，再评估银行经营收益</text><rect x="32" y="85" width="278" height="106" rx="8" fill="#fafafa" stroke="#e4e4e4" /><text x="171.0" y="115" text-anchor="middle" font-size="19" fill="#262626">用户与任务</text><text x="171.0" y="142" text-anchor="middle" font-size="14" fill="#666666">确认未来付款</text><text x="171.0" y="165" text-anchor="middle" font-size="14" fill="#666666">分类核对及预算维护</text><rect x="360" y="85" width="278" height="106" rx="8" fill="#fff4f4" stroke="#b51c26" /><text x="499.0" y="115" text-anchor="middle" font-size="19" fill="#b51c26">银行规划模块</text><text x="499.0" y="142" text-anchor="middle" font-size="14" fill="#666666">减少重复核算</text><text x="499.0" y="165" text-anchor="middle" font-size="14" fill="#666666">复用账户与交易渠道</text><rect x="690" y="85" width="278" height="106" rx="8" fill="#fafafa" stroke="#e4e4e4" stroke-dasharray="6 4"/><text x="829.0" y="115" text-anchor="middle" font-size="19" fill="#262626">合作数据伙伴</text><text x="829.0" y="142" text-anchor="middle" font-size="14" fill="#666666">仅提供授权范围内数据</text><text x="829.0" y="165" text-anchor="middle" font-size="14" fill="#666666">无需取得全部用户画像</text><path d="M310 138 L355 138" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M690 138 L643 138" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="220" y="250" width="560" height="102" rx="8" fill="#fff4f4" stroke="#b51c26" /><text x="500.0" y="280" text-anchor="middle" font-size="19" fill="#b51c26">用试点结果决定是否扩大</text><text x="500.0" y="307" text-anchor="middle" font-size="14" fill="#666666">正确率、错误放行、耗时、理解、维护成本</text><text x="500.0" y="330" text-anchor="middle" font-size="14" fill="#666666">银行收益与数据采购费用另行验证</text><path d="M500 192 L500 245" stroke="#999" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /></g></svg>